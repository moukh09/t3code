receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  filter/provider_operations:
    error_mode: ignore
    traces:
      span:
        - 'name != "t3.provider.operation"'

exporters:
  file/traces:
    path: /var/lib/otel/traces.ndjson
    format: json
    flush_interval: 1s
    rotation:
      max_megabytes: 10
      max_days: 30
      max_backups: 100
      localtime: false
  file/metrics:
    path: /var/lib/otel/metrics.ndjson
    format: json
    flush_interval: 1s
    rotation:
      max_megabytes: 10
      max_days: 30
      max_backups: 100
      localtime: false

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/provider_operations]
      exporters: [file/traces]
    metrics:
      receivers: [otlp]
      exporters: [file/metrics]
